[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creator-to-curriculum"
version = "0.1.0"
description = "Turn a creator's video archive into an evidence-backed curriculum with your agent."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "cyberpinkman"}]
dependencies = []

[project.scripts]
c2c = "creator_curriculum.cli:main"

[tool.setuptools.packages.find]
include = ["creator_curriculum*"]

[tool.setuptools.package-data]
creator_curriculum = ["web/*.html", "web/*.css", "web/*.js"]
